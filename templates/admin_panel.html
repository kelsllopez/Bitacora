{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="dropdown">
            <button class="btn btn-primary dropdown-toggle rounded-3 shadow-sm" type="button" id="mgmtDrop" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-cog me-2"></i> Gestión
            </button>
            <ul class="dropdown-menu dropdown-menu-end border-0 shadow" aria-labelledby="mgmtDrop">
                <li><a class="dropdown-item" id="limpiar-filtros" href="#"><i class="fas fa-eraser me-2"></i>Limpiar Filtros</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{% url 'menu' %}"><i class="fas fa-home me-2"></i>Menú Principal</a></li>
            </ul>
        </div>
    </div>

    <div class="filters">
        <div class="filter-item">
            <label class="filter-label"><i class="fas fa-calendar-alt"></i> Fecha</label>
            <input type="date" id="filter-fecha" class="form-control form-control-sm shadow-sm">
        </div>
        <div class="filter-item">
            <label class="filter-label"><i class="fas fa-map-marker-alt"></i> Ubicación</label>
            <select id="filter-ubicacion" class="form-select form-select-sm shadow-sm">
                <option value="">Todas</option>
                {% for valor, nombre in opciones_ubicacion %}
                    <option value="{{ valor }}">{{ nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="filter-item">
            <label class="filter-label"><i class="fas fa-user-shield"></i> Responsable</label>
            <select id="filter-responsable" class="form-select form-select-sm shadow-sm">
                <option value="">Todos</option>
                {% for valor, nombre in opciones_responsable %}
                    <option value="{{ valor }}">{{ nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="filter-item">
            <label class="filter-label"><i class="fas fa-tag"></i> Tipo</label>
            <select id="filter-tipo" class="form-select form-select-sm shadow-sm">
                <option value="">Todos</option>
                <option value="interno">Interna</option>
                <option value="externo">Externa</option>
            </select>
        </div>
    </div>

    <div class="counters-wrapper">
        <div class="counter-card counter-internos">
            <h2><i class="fas fa-users-cog me-2"></i> Internos</h2>
            <p id="total-internos">0</p>
        </div>
        <div class="counter-card counter-externos">
            <h2><i class="fas fa-user-friends me-2"></i> Externos</h2>
            <p id="total-externos">0</p>
        </div>
        <div class="counter-card counter-total">
            <h2><i class="fas fa-chart-line me-2"></i> Total</h2>
            <p id="total-general">0</p>
        </div>
    </div>

    <div class="table-container">
        <table id="tabla-bitacoras" class="table table-hover responsive nowrap">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Visitante</th>
                    <th>Responsable</th>
                    <th>Ubicación</th>
                    <th>Motivo</th>
                    <th>Observaciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
{% block extra_js %}
<script src="{% static 'js/admin.js' %}"></script>
{% endblock %}
</body>
</html>
