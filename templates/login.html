{% extends 'base.html' %}

{% block title %}Inicio de Sesión - Bitácora{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-journal-check"></i>
            <h2>Bitácora de Oficina</h2>
            <p>Sistema de Registro de Visitas</p>
        </div>
        
        <form method="post" class="login-form">
            {% csrf_token %}
            
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
                <label for="username"><i class="bi bi-person"></i> Usuario</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>

    </div>
</div>
{% endblock %}
